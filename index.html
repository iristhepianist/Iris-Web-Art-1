<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Day 1 — Fluid Pride</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            position: fixed;
            inset: 0;
            display: block;
            cursor: crosshair;
        }

        #lambda {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }

        .lsym {
            font-family: 'Courier New', monospace;
            font-size: 54px;
            font-weight: bold;
            line-height: 1;
            background: linear-gradient(150deg, #55cdfc 0%, #f7a8b8 42%, #ffffff 58%, #a567b8 85%, #55cdfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3.5s ease-in-out infinite;
        }

        .ltxt {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            color: rgba(85, 205, 252, 0.55);
            margin-top: 7px;
        }

        @keyframes glow {

            0%,
            100% {
                filter: drop-shadow(0 0 6px rgba(85, 205, 252, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 24px rgba(85, 205, 252, 0.9)) drop-shadow(0 0 44px rgba(165, 103, 184, 0.55));
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>
    <div id="lambda">
        <div class="lsym">&#955;</div>
        <div class="ltxt">always exist</div>
    </div>

    <script>
        var CHARS = ' .:-=+*xX$#@';
        var CHAR_LEN = CHARS.length;

        var FLAGS = {
            rainbow: [[228, 3, 3], [255, 140, 0], [255, 237, 0], [0, 128, 38], [0, 77, 255], [117, 7, 135]],
            trans: [[85, 205, 252], [247, 168, 184], [255, 255, 255], [247, 168, 184], [85, 205, 252]],
            bisexual: [[214, 2, 112], [155, 79, 150], [0, 56, 168]],
            nonbinary: [[255, 244, 48], [255, 255, 255], [156, 89, 209], [44, 44, 44]],
            lesbian: [[213, 45, 0], [255, 255, 255], [163, 2, 98]],
            pan: [[255, 33, 140], [255, 216, 0], [33, 177, 255]]
        };

        var FLAG_NAMES = Object.keys(FLAGS);
        var MESSAGES = ['you exist', 'be proud', 'you are loved', 'you matter', 'always'];

        var flagIndex = 0;
        var currentFlag = FLAG_NAMES[0];
        var prevFlagColors = FLAGS[currentFlag];
        var nextFlagColors = FLAGS[currentFlag];
        var transT = 1;
        var TRANS_DURATION = 90;

        var formation = 0;
        var messageIndex = 0;

        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        var N = 1, M = 1;
        var charW = 8, charH = 16;

        var vx, vy, pvx, pvy;
        var ci, pci;
        var dens, pdens;
        var tmp;

        var typedText = '';
        var textGrid = null;
        var textPad = 2;
        var textCanvas = document.createElement('canvas');
        var textCtx = textCanvas.getContext('2d');

        var FONT_SIZE = 12;
        var FONT = FONT_SIZE + 'px "Courier New", monospace';

        function measureChar() {
            var el = document.createElement('span');
            el.style.cssText = 'font:' + FONT + ';position:absolute;visibility:hidden;white-space:pre;';
            el.textContent = 'MMMMMMMMMM';
            document.body.appendChild(el);
            charW = el.getBoundingClientRect().width / 10;
            document.body.removeChild(el);
            charH = FONT_SIZE * 1.35;
        }

        function IX(x, y) {
            if (x < 0) x = 0; else if (x >= N) x = N - 1;
            if (y < 0) y = 0; else if (y >= M) y = M - 1;
            return x + y * N;
        }

        function lerpColor(a, b, t) {
            return [
                a[0] + (b[0] - a[0]) * t,
                a[1] + (b[1] - a[1]) * t,
                a[2] + (b[2] - a[2]) * t
            ];
        }

        function getColor(si) {
            var pLen = prevFlagColors.length;
            var nLen = nextFlagColors.length;
            var pSi = si % pLen;
            var nSi = si % nLen;
            if (transT >= 1) return nextFlagColors[nSi];
            var smooth = transT * transT * (3 - 2 * transT);
            return lerpColor(prevFlagColors[pSi], nextFlagColors[nSi], smooth);
        }

        function getNumStripes() {
            return FLAGS[currentFlag].length;
        }

        function setBnd(b, f) {
            var i, j;
            for (i = 1; i < N - 1; i++) {
                f[i] = b === 2 ? -f[i + N] : f[i + N];
                f[i + (M - 1) * N] = b === 2 ? -f[i + (M - 2) * N] : f[i + (M - 2) * N];
            }
            for (j = 1; j < M - 1; j++) {
                f[j * N] = b === 1 ? -f[1 + j * N] : f[1 + j * N];
                f[N - 1 + j * N] = b === 1 ? -f[N - 2 + j * N] : f[N - 2 + j * N];
            }
            f[0] = 0.5 * (f[1] + f[N]);
            f[N - 1] = 0.5 * (f[N - 2] + f[N - 1 + N]);
            f[(M - 1) * N] = 0.5 * (f[1 + (M - 1) * N] + f[(M - 2) * N]);
            f[N - 1 + (M - 1) * N] = 0.5 * (f[N - 2 + (M - 1) * N] + f[N - 1 + (M - 2) * N]);
        }

        function linSolve(b, x, x0, a, c) {
            var inv = 1.0 / c;
            var k, j, i, idx;
            for (k = 0; k < 2; k++) {
                for (j = 1; j < M - 1; j++) {
                    for (i = 1; i < N - 1; i++) {
                        idx = i + j * N;
                        x[idx] = (x0[idx] + a * (x[idx + 1] + x[idx - 1] + x[idx + N] + x[idx - N])) * inv;
                    }
                }
                setBnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff) {
            var a = 0.016 * diff * (N - 2) * (M - 2);
            linSolve(b, x, x0, a, 1 + 4 * a);
        }

        function advect(b, d, d0, vxf, vyf) {
            var dtx = 0.016 * (N - 2);
            var dty = 0.016 * (M - 2);
            var i, j, x, y, i0, i1, j0, j1, s0, s1, t0, t1, idx;
            for (j = 1; j < M - 1; j++) {
                for (i = 1; i < N - 1; i++) {
                    idx = i + j * N;
                    x = i - dtx * vxf[idx];
                    y = j - dty * vyf[idx];
                    if (x < 0.5) x = 0.5; if (x > N - 1.5) x = N - 1.5;
                    if (y < 0.5) y = 0.5; if (y > M - 1.5) y = M - 1.5;
                    i0 = x | 0; i1 = i0 + 1; j0 = y | 0; j1 = j0 + 1;
                    s1 = x - i0; s0 = 1 - s1; t1 = y - j0; t0 = 1 - t1;
                    d[idx] = s0 * (t0 * d0[i0 + j0 * N] + t1 * d0[i0 + j1 * N]) + s1 * (t0 * d0[i1 + j0 * N] + t1 * d0[i1 + j1 * N]);
                }
            }
            setBnd(b, d);
        }

        function advectNearest(dest, src, vxf, vyf) {
            var dtx = 0.016 * (N - 2);
            var dty = 0.016 * (M - 2);
            var i, j, x, y, idx, sx, sy;
            for (j = 1; j < M - 1; j++) {
                for (i = 1; i < N - 1; i++) {
                    idx = i + j * N;
                    x = i - dtx * vxf[idx];
                    y = j - dty * vyf[idx];
                    sx = Math.round(x); sy = Math.round(y);
                    if (sx < 0) sx = 0; if (sx >= N) sx = N - 1;
                    if (sy < 0) sy = 0; if (sy >= M) sy = M - 1;
                    dest[idx] = src[sx + sy * N];
                }
            }
            for (i = 0; i < N; i++) {
                dest[i] = dest[i + N];
                dest[i + (M - 1) * N] = dest[i + (M - 2) * N];
            }
            for (j = 0; j < M; j++) {
                dest[j * N] = dest[1 + j * N];
                dest[N - 1 + j * N] = dest[N - 2 + j * N];
            }
        }

        function project(vxf, vyf, p, div) {
            var i, j, idx;
            for (j = 1; j < M - 1; j++) {
                for (i = 1; i < N - 1; i++) {
                    idx = i + j * N;
                    div[idx] = -0.5 * ((vxf[idx + 1] - vxf[idx - 1]) / N + (vyf[idx + N] - vyf[idx - N]) / M);
                    p[idx] = 0;
                }
            }
            setBnd(0, div); setBnd(0, p);
            linSolve(0, p, div, 1, 4);
            for (j = 1; j < M - 1; j++) {
                for (i = 1; i < N - 1; i++) {
                    idx = i + j * N;
                    vxf[idx] -= 0.5 * N * (p[idx + 1] - p[idx - 1]);
                    vyf[idx] -= 0.5 * M * (p[idx + N] - p[idx - N]);
                }
            }
            setBnd(1, vxf); setBnd(2, vyf);
        }

        function maskText() {
            if (!textGrid) return;
            var i, idx, x, y;
            for (idx = 0; idx < N * M; idx++) {
                if (!textGrid[idx]) continue;
                dens[idx] = 0;
                vx[idx] = 0;
                vy[idx] = 0;
            }
            for (idx = 0; idx < N * M; idx++) {
                if (!textGrid[idx]) continue;
                x = idx % N; y = (idx / N) | 0;
                for (var dy = -textPad; dy <= textPad; dy++) {
                    for (var dx = -textPad; dx <= textPad; dx++) {
                        var ni = IX(x + dx, y + dy);
                        if (!textGrid[ni]) {
                            dens[ni] *= 0.5;
                            vx[ni] *= 0.3;
                            vy[ni] *= 0.3;
                        }
                    }
                }
            }
        }

        function fluidStep() {
            tmp = vx; vx = pvx; pvx = tmp; diffuse(1, vx, pvx, 0.0000005);
            tmp = vy; vy = pvy; pvy = tmp; diffuse(2, vy, pvy, 0.0000005);
            project(vx, vy, pvx, pvy);
            tmp = vx; vx = pvx; pvx = tmp; tmp = vy; vy = pvy; pvy = tmp;
            advect(1, vx, pvx, pvx, pvy); advect(2, vy, pvy, pvx, pvy);
            project(vx, vy, pvx, pvy);

            tmp = dens; dens = pdens; pdens = tmp;
            diffuse(0, dens, pdens, 0.000015);
            tmp = dens; dens = pdens; pdens = tmp;
            advect(0, dens, pdens, vx, vy);

            pci.set(ci);
            advectNearest(ci, pci, vx, vy);

            maskText();

            var i, sz = N * M;
            for (i = 0; i < sz; i++) {
                vx[i] *= 0.997;
                vy[i] *= 0.997;
                dens[i] *= 0.996;
                if (dens[i] < 0.001) dens[i] = 0;
            }
        }

        function initFluid(nc, nr) {
            N = nc; M = nr;
            var sz = N * M;
            vx = new Float32Array(sz); vy = new Float32Array(sz);
            pvx = new Float32Array(sz); pvy = new Float32Array(sz);
            dens = new Float32Array(sz); pdens = new Float32Array(sz);
            ci = new Uint8Array(sz); pci = new Uint8Array(sz);
        }

        function stripeFor(x, y, form) {
            var numC = getNumStripes();
            var si;
            switch (form) {
                case 0:
                    si = Math.floor((y / M) * numC);
                    break;
                case 1:
                    si = Math.floor((x / N) * numC);
                    break;
                case 2:
                    var band = Math.floor((y / M) * numC);
                    var seg = Math.floor(x / (N / 6));
                    si = (seg % 2 === 0) ? band : (numC - 1 - band);
                    break;
                case 3:
                    var wave = Math.sin(x / N * Math.PI * 6 + stirT * 2) * M * 0.12;
                    si = Math.floor(((y + wave) / M) * numC);
                    break;
            }
            if (si < 0) si = 0;
            if (si >= numC) si = numC - 1;
            return si;
        }

        var stirT = 0;
        var FLAG_DURATION = 480;

        function autoAnimate() {
            stirT += 0.004;

            if (transT < 1) {
                transT += 1 / TRANS_DURATION;
                if (transT > 1) transT = 1;
            }

            for (var s = 0; s < 7; s++) {
                var phase = stirT + s * 0.898;
                var radius = 0.3 + 0.15 * Math.sin(phase * 0.25 + s * 0.5);
                var cx = N * (0.5 + radius * Math.sin(phase * 0.6 + s * 1.1));
                var cy = M * (0.5 + radius * Math.cos(phase * 0.8 + s * 0.7));
                var gi = Math.round(cx), gj = Math.round(cy);

                if (gi < 4 || gi >= N - 4 || gj < 4 || gj >= M - 4) continue;

                var amt = 0.7 + 0.3 * Math.sin(phase * 1.5);
                var vStr = 2.0;

                for (var dy = -3; dy <= 3; dy++) {
                    for (var dx = -3; dx <= 3; dx++) {
                        if (dx * dx + dy * dy > 12) continue;
                        var idx = IX(gi + dx, gj + dy);
                        if (textGrid && textGrid[idx]) continue;
                        dens[idx] += amt * 0.6;
                        ci[idx] = stripeFor(gi + dx, gj + dy, formation);
                        vx[idx] += Math.cos(phase * 1.1 + s * 0.8) * vStr;
                        vy[idx] += Math.sin(phase * 1.4 - s * 0.6) * vStr;
                    }
                }
            }

            if (frame % 180 < 40 && frame % 2 === 0) {
                var waveY = Math.floor(M * 0.5 + Math.sin(stirT * 0.4) * M * 0.3);
                for (var wi = 2; wi < N - 2; wi += 2) {
                    var widx = IX(wi, waveY);
                    if (textGrid && textGrid[widx]) continue;
                    vx[widx] += Math.sin(wi / N * 6.28 * 3 + stirT * 4) * 3;
                    vy[widx] += Math.cos(wi / N * 6.28 * 2 + stirT * 3) * 1.5;
                    dens[widx] += 0.8;
                    ci[widx] = stripeFor(wi, waveY, formation);
                }
            }
        }

        function updateTextBitmap() {
            if (N < 2 || M < 2) return;
            var text = typedText || MESSAGES[messageIndex];
            if (!text || text.length === 0) { textGrid = null; return; }

            textCanvas.width = N;
            textCanvas.height = M;
            textCtx.clearRect(0, 0, N, M);

            var fontSize = Math.floor(M * 0.5);
            textCtx.font = 'bold ' + fontSize + 'px monospace';
            var met = textCtx.measureText(text);

            while (met.width > N * 0.85 && fontSize > 4) {
                fontSize -= 1;
                textCtx.font = 'bold ' + fontSize + 'px monospace';
                met = textCtx.measureText(text);
            }

            textCtx.fillStyle = '#fff';
            textCtx.fillText(text, (N - met.width) / 2, M / 2 + fontSize * 0.35);

            var imgData = textCtx.getImageData(0, 0, N, M);
            textGrid = new Uint8Array(N * M);
            for (var i = 0; i < N * M; i++) {
                textGrid[i] = imgData.data[i * 4 + 3] > 60 ? 1 : 0;
            }
        }

        function cycleFlag() {
            prevFlagColors = FLAGS[currentFlag];
            flagIndex = (flagIndex + 1) % FLAG_NAMES.length;
            currentFlag = FLAG_NAMES[flagIndex];
            nextFlagColors = FLAGS[currentFlag];
            transT = 0;
            formation = (formation + 1) % 4;
            if (!typedText) {
                messageIndex = (messageIndex + 1) % MESSAGES.length;
            }
            updateTextBitmap();
        }

        function calcGrid() {
            measureChar();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            var nc = Math.ceil(window.innerWidth / charW) + 1;
            var nr = Math.ceil(window.innerHeight / charH) + 1;
            initFluid(nc, nr);
            updateTextBitmap();
        }

        function injectAt(gx, gy, fx, fy) {
            var amt = 3.5;
            var dy, dx, w, idx;
            for (dy = -2; dy <= 2; dy++) {
                for (dx = -2; dx <= 2; dx++) {
                    w = (dx === 0 && dy === 0) ? 1 : (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) ? 0.5 : 0.2;
                    idx = IX(gx + dx, gy + dy);
                    if (textGrid && textGrid[idx]) continue;
                    vx[idx] += fx * w;
                    vy[idx] += fy * w;
                    dens[idx] += amt * w;
                    ci[idx] = stripeFor(gx + dx, gy + dy, formation);
                }
            }
        }

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = FONT;
            var baseline = charH * 0.78;
            var numC = getNumStripes();
            var i, j, idx, d, si, c, bright, rr, gg, bb, charIdx, ch;
            var curR = -1, curG = -1, curB = -1;
            var spanStr = '', spanX = 0;

            for (j = 0; j < M; j++) {
                curR = -1; spanStr = ''; spanX = 0;
                for (i = 0; i < N; i++) {
                    idx = i + j * N;

                    if (textGrid && textGrid[idx]) {
                        if (spanStr.length > 0 && curR >= 0) {
                            ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                            ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                            spanStr = ''; curR = -1;
                        }
                        continue;
                    }

                    d = dens[idx];

                    if (d < 0.015) {
                        if (spanStr.length > 0 && curR >= 0) {
                            ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                            ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                            spanStr = ''; curR = -1;
                        }
                        continue;
                    }

                    si = ci[idx] % numC;
                    c = getColor(si);
                    bright = d * 1.5;
                    if (bright > 1) bright = 1;

                    rr = (c[0] * bright) | 0;
                    gg = (c[1] * bright) | 0;
                    bb = (c[2] * bright) | 0;
                    rr = (rr >> 3) << 3;
                    gg = (gg >> 3) << 3;
                    bb = (bb >> 3) << 3;

                    charIdx = (d * CHAR_LEN * 1.5) | 0;
                    if (charIdx >= CHAR_LEN) charIdx = CHAR_LEN - 1;
                    ch = CHARS[charIdx];

                    if (rr === curR && gg === curG && bb === curB) {
                        spanStr += ch;
                    } else {
                        if (spanStr.length > 0 && curR >= 0) {
                            ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                            ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                        }
                        curR = rr; curG = gg; curB = bb;
                        spanX = i; spanStr = ch;
                    }
                }
                if (spanStr.length > 0 && curR >= 0) {
                    ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                    ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                }
            }

            renderText(baseline);
        }

        function renderText(baseline) {
            if (!textGrid) return;
            var numC = getNumStripes();
            var i, j, idx, si, c;
            var curR = -1, curG = -1, curB = -1;
            var spanStr = '', spanX = 0;

            for (j = 0; j < M; j++) {
                curR = -1; spanStr = ''; spanX = 0;
                for (i = 0; i < N; i++) {
                    idx = i + j * N;

                    if (!textGrid[idx]) {
                        if (spanStr.length > 0 && curR >= 0) {
                            ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                            ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                            spanStr = ''; curR = -1;
                        }
                        continue;
                    }

                    si = stripeFor(i, j, formation) % numC;
                    c = getColor(si);

                    var rr = c[0] | 0;
                    var gg = c[1] | 0;
                    var bb = c[2] | 0;
                    rr = (rr >> 3) << 3;
                    gg = (gg >> 3) << 3;
                    bb = (bb >> 3) << 3;

                    if (rr === curR && gg === curG && bb === curB) {
                        spanStr += '#';
                    } else {
                        if (spanStr.length > 0 && curR >= 0) {
                            ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                            ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                        }
                        curR = rr; curG = gg; curB = bb;
                        spanX = i; spanStr = '#';
                    }
                }
                if (spanStr.length > 0 && curR >= 0) {
                    ctx.fillStyle = 'rgb(' + curR + ',' + curG + ',' + curB + ')';
                    ctx.fillText(spanStr, spanX * charW, j * charH + baseline);
                }
            }
        }

        var audioCtx = null;
        var droneOscs = [];
        var droneMaster = null;
        var smoothHue = 200;

        var RATIOS = [1, 1.498, 1.888, 2, 2.52, 3];
        var VOLS = [0.3, 0.22, 0.18, 0.25, 0.12, 0.08];

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            droneMaster = audioCtx.createGain();
            droneMaster.gain.value = 0;

            var compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -18;
            compressor.knee.value = 8;
            compressor.ratio.value = 6;
            droneMaster.connect(compressor);
            compressor.connect(audioCtx.destination);

            var types = ['sawtooth', 'sawtooth', 'triangle', 'sawtooth', 'triangle', 'sine'];
            for (var i = 0; i < RATIOS.length; i++) {
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                gain.gain.value = VOLS[i];
                osc.connect(gain);
                gain.connect(droneMaster);
                osc.type = types[i];
                osc.frequency.value = 110 * RATIOS[i];
                osc.start();
                droneOscs.push(osc);
            }
        }

        function rgbToHue(r, g, b) {
            var mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
            var mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
            var d = mx - mn;
            if (d < 0.001) return 0;
            var h;
            if (mx === r) h = ((g - b) / d + 6) % 6;
            else if (mx === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            return h * 60;
        }

        function hueToRoot(hue) {
            var semitones = [0, 2, 3, 5, 7, 8, 10, 12, 14, 15, 17, 19];
            var idx = Math.floor((hue / 360) * semitones.length) % semitones.length;
            return 55 * Math.pow(2, semitones[idx] / 12);
        }

        function updateDrone() {
            if (!audioCtx) return;
            var colors = FLAGS[currentFlag];
            var counts = new Float32Array(colors.length);
            var total = 0;
            var i, sz = N * M;
            for (i = 0; i < sz; i += 4) {
                if (dens[i] > 0.03) {
                    counts[ci[i] % colors.length] += dens[i];
                    total += dens[i];
                }
            }
            if (total > 0.01) {
                var sumR = 0, sumG = 0, sumB = 0;
                for (i = 0; i < colors.length; i++) {
                    var w = counts[i] / total;
                    sumR += colors[i][0] * w;
                    sumG += colors[i][1] * w;
                    sumB += colors[i][2] * w;
                }
                var targetHue = rgbToHue(sumR / 255, sumG / 255, sumB / 255);
                smoothHue += (targetHue - smoothHue) * 0.06;
            }
            var root = hueToRoot(smoothHue);
            var t = audioCtx.currentTime;
            for (i = 0; i < droneOscs.length; i++) {
                droneOscs[i].frequency.setTargetAtTime(root * RATIOS[i], t, 0.25);
            }
            var totalDens = 0;
            for (var k = 0; k < sz; k += 8) totalDens += dens[k];
            var densNorm = Math.min(1, totalDens / (sz * 0.04));
            var vol = 0.08 + densNorm * 0.07;
            droneMaster.gain.setTargetAtTime(vol, t, 0.15);
        }

        var prevMX = -1, prevMY = -1, mouseDown = false;

        canvas.addEventListener('mousedown', function () { mouseDown = true; initAudio(); });
        canvas.addEventListener('mouseup', function () { mouseDown = false; prevMX = -1; prevMY = -1; });
        canvas.addEventListener('mouseleave', function () { mouseDown = false; prevMX = -1; prevMY = -1; });

        canvas.addEventListener('mousemove', function (e) {
            if (!mouseDown) return;
            var gx = Math.round(e.clientX / charW);
            var gy = Math.round(e.clientY / charH);
            var fx = 0, fy = 0;
            if (prevMX >= 0) { fx = (e.clientX - prevMX) * 0.6; fy = (e.clientY - prevMY) * 0.6; }
            prevMX = e.clientX; prevMY = e.clientY;
            injectAt(gx, gy, fx, fy);
        });

        document.addEventListener('keydown', function (e) {
            initAudio();
            if (e.key === 'Backspace') {
                typedText = typedText.slice(0, -1);
                e.preventDefault();
            } else if (e.key === 'Enter') {
                typedText = '';
                e.preventDefault();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                typedText += e.key;
            } else {
                return;
            }
            updateTextBitmap();
        });

        var touches = {};
        var prevPinchDist = -1;

        canvas.addEventListener('touchstart', function (e) {
            e.preventDefault();
            initAudio();
            for (var i = 0; i < e.changedTouches.length; i++) {
                var t = e.changedTouches[i];
                touches[t.identifier] = { x: t.clientX, y: t.clientY };
            }
            if (e.touches.length === 2) prevPinchDist = pinchDist(e.touches);
        }, { passive: false });

        canvas.addEventListener('touchmove', function (e) {
            e.preventDefault();
            if (e.touches.length === 1) {
                var t = e.touches[0], prev = touches[t.identifier];
                var gx = Math.round(t.clientX / charW), gy = Math.round(t.clientY / charH);
                var fx = 0, fy = 0;
                if (prev) { fx = (t.clientX - prev.x) * 0.6; fy = (t.clientY - prev.y) * 0.6; }
                injectAt(gx, gy, fx, fy);
                touches[t.identifier] = { x: t.clientX, y: t.clientY };
            } else if (e.touches.length === 2) {
                var dist = pinchDist(e.touches), delta = dist - prevPinchDist;
                if (prevPinchDist > 0 && Math.abs(delta) > 1) {
                    var mx = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
                    var my = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
                    var cgx = Math.round(mx / charW), cgy = Math.round(my / charH);
                    var strength = delta * 0.4;
                    for (var r = 1; r <= 8; r++) {
                        for (var angle = 0; angle < 6.28; angle += 0.314) {
                            var ix = Math.round(cgx + Math.cos(angle) * r);
                            var iy = Math.round(cgy + Math.sin(angle) * r);
                            if (ix < 1 || ix >= N - 1 || iy < 1 || iy >= M - 1) continue;
                            var iidx = ix + iy * N;
                            vx[iidx] += Math.cos(angle) * strength;
                            vy[iidx] += Math.sin(angle) * strength;
                        }
                    }
                    injectAt(cgx, cgy, 0, 0);
                }
                prevPinchDist = dist;
                for (var i = 0; i < e.touches.length; i++) {
                    var tt = e.touches[i];
                    touches[tt.identifier] = { x: tt.clientX, y: tt.clientY };
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function (e) {
            for (var i = 0; i < e.changedTouches.length; i++) delete touches[e.changedTouches[i].identifier];
            if (e.touches.length < 2) prevPinchDist = -1;
        }, { passive: false });

        function pinchDist(t) {
            var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        var frame = 0;

        function loop() {
            fluidStep();
            autoAnimate();

            if (frame % FLAG_DURATION === 0 && frame > 0) {
                cycleFlag();
            }

            render();
            if (frame % 6 === 0) updateDrone();
            frame++;
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', calcGrid);
        calcGrid();
        requestAnimationFrame(loop);
    </script>
</body>
